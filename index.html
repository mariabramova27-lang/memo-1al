<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мягкая математика — Мемо: Формулы</title>
<style>
  :root{
    --turquoise:#2AB7A9;
    --gold:#F4A261;
    --dark:#0F1A2E;
    --white:#FFFFFF;
    --gray:#8AA8A5;
    --ok:#3ecf8e;
    --err:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Open Sans','Segoe UI',system-ui,sans-serif;
    background:radial-gradient(circle at 20% 10%, #1b2b4a 0%, var(--dark) 60%);
    color:var(--white);
    min-height:100vh;padding:20px;line-height:1.5;
    overflow-x:hidden;
  }
  h1,h2,h3{font-family:'Montserrat','Segoe UI',sans-serif;letter-spacing:.5px;}
  .app{max-width:1000px;margin:0 auto;}

  /* Шапка */
  header.top{
    display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:12px;margin-bottom:24px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .logo{
    width:52px;height:52px;border-radius:14px;
    background:linear-gradient(135deg,var(--turquoise),var(--gold));
    display:flex;align-items:center;justify-content:center;font-size:26px;
    box-shadow:0 6px 20px rgba(42,183,169,.4);
  }
  .brand h1{font-size:20px;}
  .brand p{font-size:12px;color:var(--gray);}

  .stats{display:flex;gap:16px;flex-wrap:wrap;}
  .stat{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(138,168,165,.25);
    border-radius:12px;padding:8px 16px;
    font-size:13px;color:var(--gray);
    min-width:90px;text-align:center;
    transition:.3s;
  }
  .stat.active{
    border-color:var(--gold);
    background:rgba(244,162,97,.12);
    color:var(--gold);
    box-shadow:0 0 20px rgba(244,162,97,.3);
  }
  .stat .val{
    font-size:20px;font-weight:800;
    color:var(--white);display:block;
  }
  .stat.active .val{color:var(--gold);}

  /* Выбор темы */
  .topics{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:10px;margin-bottom:20px;
  }
  .topic{
    background:rgba(255,255,255,.04);
    border:2px solid rgba(138,168,165,.3);
    border-radius:14px;padding:14px 12px;
    cursor:pointer;transition:.3s;text-align:center;
    font-size:13px;font-weight:600;
  }
  .topic:hover{
    transform:translateY(-3px);
    border-color:var(--turquoise);
    background:rgba(42,183,169,.1);
  }
  .topic.active{
    background:linear-gradient(135deg,var(--turquoise),#38d0c0);
    border-color:var(--turquoise);
    color:var(--dark);
    box-shadow:0 8px 24px rgba(42,183,169,.45);
    transform:translateY(-3px);
  }
  .topic .icon{font-size:26px;display:block;margin-bottom:4px;}

  /* Инфо темы */
  .topic-info{
    background:rgba(42,183,169,.1);
    border:1px solid rgba(42,183,169,.3);
    border-radius:14px;padding:12px 18px;
    margin-bottom:20px;font-size:13px;
    color:var(--gray);
    line-height:1.6;
  }
  .topic-info strong{color:var(--gold);}

  /* Игровое поле */
  .board-wrap{
    background:rgba(255,255,255,.03);
    border:1px solid rgba(138,168,165,.2);
    border-radius:20px;padding:20px;
    margin-bottom:20px;
    min-height:400px;
    position:relative;
    overflow:hidden;
    max-width:760px;
    margin-left:auto;
    margin-right:auto;
  }
  .board{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    perspective:1000px;
  }
  @media(max-width:700px){
    .board{grid-template-columns:repeat(3,1fr);gap:8px;}
  }
  @media(max-width:480px){
    .board{grid-template-columns:repeat(2,1fr);gap:6px;}
  }

  /* Карточка — гарантированный квадрат */
  .card{
    position:relative;
    width:100%;
    padding-bottom:100%; /* высота = ширине */
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,0,.2,1);
  }
  .card.flipped{transform:rotateY(180deg);}
  .card.matched{animation:matchedPop .6s ease;}
  @keyframes matchedPop{
    0%{transform:rotateY(180deg) scale(1);}
    40%{transform:rotateY(180deg) scale(1.15);}
    100%{transform:rotateY(180deg) scale(1);}
  }
  .card-face{
    position:absolute;
    top:0;left:0;
    width:100%;height:100%;
    border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    padding:8px;text-align:center;
    font-size:15px;font-weight:700;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
    user-select:none;
    overflow:hidden;
  }

  /* Рубашка */
  .card-back{
    background:
      radial-gradient(circle at 30% 30%, rgba(244,162,97,.35) 0%, transparent 50%),
      radial-gradient(circle at 70% 70%, rgba(42,183,169,.4) 0%, transparent 50%),
      linear-gradient(135deg, #1a2a44 0%, #0F1A2E 100%);
    border:2px solid rgba(42,183,169,.4);
    overflow:hidden;
    position:relative;
  }
  .card-back::before{
    content:'∑';
    position:absolute;
    font-size:80px;
    color:rgba(42,183,169,.15);
    font-family:'Montserrat',sans-serif;
    font-weight:900;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    transition:.4s;
    pointer-events:none;
  }
  .card-back::after{
    content:'';
    position:absolute;
    inset:0;
    background:
      repeating-linear-gradient(
        45deg,
        transparent,
        transparent 8px,
        rgba(244,162,97,.06) 8px,
        rgba(244,162,97,.06) 16px
      );
    pointer-events:none;
  }
  .card:hover .card-back{
    border-color:var(--gold);
    box-shadow:0 0 24px rgba(244,162,97,.5);
  }
  .card:hover .card-back::before{
    transform:translate(-50%,-50%) rotate(15deg) scale(1.1);
    color:rgba(244,162,97,.25);
  }
  .card-back .label{
    position:absolute;
    bottom:6px;left:50%;
    transform:translateX(-50%);
    font-size:9px;
    color:rgba(244,162,97,.6);
    letter-spacing:2px;
    font-weight:600;
    z-index:2;
  }

  /* Лицо */
  .card-front{
    background:linear-gradient(135deg, #ffffff 0%, #f0f7f6 100%);
    color:var(--dark);
    transform:rotateY(180deg);
    border:2px solid var(--turquoise);
    font-family:'Courier New',monospace;
    font-size:16px;
    line-height:1.3;
    flex-direction:column;
  }
  .card-front .expr,
  .card-front .result{
    font-weight:800;
    word-break:break-word;
  }
  .card-front .result{
    font-size:14px;
    color:#2AB7A9;
    font-weight:700;
  }
  .card.matched .card-front{
    background:linear-gradient(135deg, #F4A261 0%, #ffce8a 100%);
    border-color:var(--gold);
    box-shadow:0 0 30px rgba(244,162,97,.7);
    animation:glow 1.5s infinite alternate;
  }
  @keyframes glow{
    from{box-shadow:0 0 20px rgba(244,162,97,.5);}
    to{box-shadow:0 0 35px rgba(244,162,97,.9);}
  }
  .card-front .badge{
    font-size:9px;
    color:#888;
    margin-top:4px;
    font-family:'Open Sans',sans-serif;
    letter-spacing:1px;
    text-transform:uppercase;
  }

  /* Победа */
  .win-overlay{
    position:absolute;inset:0;
    background:rgba(15,26,46,.92);
    border-radius:20px;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    animation:fade .5s ease;
    z-index:10;
    text-align:center;
    padding:20px;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .win-overlay .trophy{
    font-size:80px;
    animation:pop .9s ease;
  }
  @keyframes pop{
    0%{transform:scale(0) rotate(-180deg);}
    70%{transform:scale(1.25) rotate(10deg);}
    100%{transform:scale(1) rotate(0);}
  }
  .win-overlay h2{
    color:var(--gold);
    font-size:28px;
    margin:10px 0;
  }
  .win-overlay p{
    color:var(--gray);
    margin-bottom:20px;
    font-size:15px;
  }
  .win-overlay .stars{
    font-size:32px;
    letter-spacing:6px;
    margin-bottom:20px;
    animation:starsPulse 1.5s infinite alternate;
  }
  @keyframes starsPulse{
    from{transform:scale(1);filter:drop-shadow(0 0 5px var(--gold));}
    to{transform:scale(1.1);filter:drop-shadow(0 0 15px var(--gold));}
  }

  /* Кнопки */
  .btn{
    background:linear-gradient(135deg,var(--turquoise),#38d0c0);
    color:var(--dark);border:none;border-radius:12px;
    padding:12px 22px;font-weight:700;font-size:14px;
    cursor:pointer;transition:.2s;font-family:inherit;
    box-shadow:0 4px 14px rgba(42,183,169,.4);
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(42,183,169,.55);}
  .btn.gold{background:linear-gradient(135deg,var(--gold),#ffb877);box-shadow:0 4px 14px rgba(244,162,97,.4);}
  .btn.ghost{background:transparent;color:var(--white);border:1px solid rgba(138,168,165,.5);box-shadow:none;}
  .btn.ghost:hover{background:rgba(255,255,255,.08);}

  .controls{
    display:flex;gap:10px;flex-wrap:wrap;
    align-items:center;justify-content:center;
  }

  /* Toast */
  .toast{
    position:fixed;top:20px;right:20px;z-index:99;
    background:linear-gradient(135deg,var(--gold),#ffce8a);color:var(--dark);
    padding:14px 22px;border-radius:14px;font-weight:700;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    animation:slideIn .4s ease;
    font-size:14px;
  }
  @keyframes slideIn{from{transform:translateX(120%)}to{transform:translateX(0)}}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <div class="logo">🧩</div>
      <div>
        <h1>Мягкая математика</h1>
        <p>Мемо-игра · Формулы и свойства</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat">
        <span class="val" id="statMoves">0</span>
        Ходов
      </div>
      <div class="stat" id="statPairsBox">
        <span class="val" id="statPairs">0/0</span>
        Пары
      </div>
      <div class="stat">
        <span class="val" id="statTime">0:00</span>
        Время
      </div>
      <div class="stat">
        <span class="val" id="statBest">—</span>
        Рекорд
      </div>
    </div>
  </header>

  <div class="topics" id="topics"></div>

  <div class="topic-info" id="topicInfo">
    Выбери тему — и играй! Найди пары «выражение ↔ результат».
  </div>

  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board"></div>
  </div>

  <div class="controls">
    <button class="btn gold" id="newGame">🎲 Новая игра</button>
    <button class="btn ghost" id="shuffleAll">🔀 Перемешать заново</button>
    <button class="btn ghost" id="resetStats">📊 Сбросить рекорд</button>
  </div>

</div>

<script>
/* ============================================================
   ТЕМЫ И ПАРЫ
   ============================================================ */
const TOPICS = {
  degrees: {
    icon:"🔢",
    name:"Свойства степени",
    hint:"aᵐ·aⁿ=aᵐ⁺ⁿ, aᵐ÷aⁿ=aᵐ⁻ⁿ, (aᵐ)ⁿ=aᵐⁿ, a⁰=1, a⁻ⁿ=1/aⁿ",
    pairs:[
      {a:"a³ · a⁵", b:"a⁸"},
      {a:"x⁴ · x⁷", b:"x¹¹"},
      {a:"b⁹ ÷ b⁴", b:"b⁵"},
      {a:"y¹² ÷ y⁵", b:"y⁷"},
      {a:"(a²)⁵", b:"a¹⁰"},
      {a:"(x³)⁴", b:"x¹²"},
      {a:"(2a)³", b:"8a³"},
      {a:"(3b²)²", b:"9b⁴"},
      {a:"5⁰", b:"1"},
      {a:"2⁻³", b:"1/8"}
    ]
  },
  formulas: {
    icon:"🧩",
    name:"Формулы сокращённого умножения",
    hint:"(a+b)² = a²+2ab+b² · (a−b)² = a²−2ab+b² · (a+b)(a−b) = a²−b²",
    pairs:[
      {a:"(x+3)²", b:"x²+6x+9"},
      {a:"(a+5)²", b:"a²+10a+25"},
      {a:"(y+1)²", b:"y²+2y+1"},
      {a:"(2x+1)²", b:"4x²+4x+1"},
      {a:"(x−3)²", b:"x²−6x+9"},
      {a:"(a−4)²", b:"a²−8a+16"},
      {a:"(2x−3)²", b:"4x²−12x+9"},
      {a:"(x+2)(x−2)", b:"x²−4"},
      {a:"(a+7)(a−7)", b:"a²−49"},
      {a:"(3x+1)(3x−1)", b:"9x²−1"}
    ]
  },
  quadequations: {
    icon:"🎯",
    name:"Квадратные уравнения",
    hint:"Если a + b + c = 0, то x₁ = 1, x₂ = c/a.",
    pairs:[
      {a:"x²−5x+4=0", b:"1 и 4"},
      {a:"x²−7x+6=0", b:"1 и 6"},
      {a:"x²−3x+2=0", b:"1 и 2"},
      {a:"x²−9x+8=0", b:"1 и 8"},
      {a:"x²−4x+3=0", b:"1 и 3"},
      {a:"x²+2x−3=0", b:"1 и −3"},
      {a:"x²+5x−6=0", b:"1 и −6"},
      {a:"2x²−5x+3=0", b:"1 и 3/2"},
      {a:"3x²−7x+4=0", b:"1 и 4/3"},
      {a:"5x²−9x+4=0", b:"1 и 4/5"}
    ]
  },
  moduledef: {
    icon:"📏",
    name:"Модуль: определение",
    hint:"|x| = x, если x ≥ 0; |x| = −x, если x < 0. |x| — расстояние до нуля.",
    pairs:[
      {a:"|5|", b:"5"},
      {a:"|−7|", b:"7"},
      {a:"|0|", b:"0"},
      {a:"|−12|", b:"12"},
      {a:"|−4|+|3|", b:"7"},
      {a:"|−8|−|2|", b:"6"},
      {a:"|5−9|", b:"4"},
      {a:"|−3|·|4|", b:"12"},
      {a:"|x|=5", b:"5 и −5"},
      {a:"|x−1|=4", b:"5 и −3"}
    ]
  },
  moduleeq: {
    icon:"📐",
    name:"Модуль: уравнения",
    hint:"|f(x)| = c: если c > 0 → f(x)=c или f(x)=−c; если c=0 → f(x)=0; если c<0 → нет корней.",
    pairs:[
      {a:"|x+2|=6", b:"4 и −8"},
      {a:"|x−3|=5", b:"8 и −2"},
      {a:"|x+7|=2", b:"−5 и −9"},
      {a:"|x−4|=1", b:"5 и 3"},
      {a:"|x+1|=8", b:"7 и −9"},
      {a:"|x−6|=0", b:"6"},
      {a:"|x+5|=−3", b:"нет корней"},
      {a:"|2x|=8", b:"4 и −4"},
      {a:"|3x|=9", b:"3 и −3"},
      {a:"|2x+1|=7", b:"3 и −4"}
    ]
  }
};

/* ============================================================
   БЕЗОПАСНЫЙ localStorage
   ============================================================ */
function safeGet(key, fallback){
  try{
    const val = localStorage.getItem(key);
    return val ? JSON.parse(val) : fallback;
  }catch(e){
    return fallback;
  }
}
function safeSet(key, value){
  try{
    localStorage.setItem(key, JSON.stringify(value));
  }catch(e){/* приватный режим — игнорируем */}
}

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
const state = {
  topic: 'formulas',
  cards: [],
  opened: [],
  matched: new Set(),
  moves: 0,
  lock: false,
  timer: null,
  seconds: 0,
  started: false,
  best: safeGet('memoBest', {})
};

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function toast(msg){
  const t=document.createElement('div');
  t.className='toast';t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function fmtTime(s){
  const m=Math.floor(s/60);
  const sec=s%60;
  return `${m}:${sec.toString().padStart(2,'0')}`;
}
function removeAllOverlays(){
  document.querySelectorAll('.win-overlay').forEach(o=>o.remove());
}

/* ============================================================
   ОТРИСОВКА ТЕМ
   ============================================================ */
function renderTopics(){
  const el=document.getElementById('topics');
  el.innerHTML='';
  Object.entries(TOPICS).forEach(([key,t])=>{
    const d=document.createElement('div');
    d.className='topic'+(state.topic===key?' active':'');
    d.innerHTML=`<span class="icon">${t.icon}</span>${t.name}`;
    d.onclick=()=>{
      state.topic=key;
      renderTopics();
      updateTopicInfo();
      startNewGame();
    };
    el.appendChild(d);
  });
}

function updateTopicInfo(){
  const t=TOPICS[state.topic];
  document.getElementById('topicInfo').innerHTML=
    `<strong>${t.icon} ${t.name}.</strong> ${t.hint}`;
}

/* ============================================================
   СТАРТ НОВОЙ ИГРЫ
   ============================================================ */
function startNewGame(){
  if(state.timer){
    clearInterval(state.timer);
    state.timer=null;
  }
  removeAllOverlays();
  state.cards=[];
  state.opened=[];
  state.matched.clear();
  state.moves=0;
  state.lock=false;
  state.seconds=0;
  state.started=false;
  document.getElementById('statMoves').textContent='0';
  document.getElementById('statTime').textContent='0:00';

  const t=TOPICS[state.topic];
  t.pairs.forEach((p,i)=>{
    state.cards.push({pairId:i, text:p.a, type:'expr'});
    state.cards.push({pairId:i, text:p.b, type:'result'});
  });
  state.cards=shuffle(state.cards);

  renderBoard();
  updateStats();
  updateBest();
}

/* ============================================================
   ОТРИСОВКА ПОЛЯ
   ============================================================ */
function renderBoard(){
  const board=document.getElementById('board');
  board.innerHTML='';
  state.cards.forEach((card,i)=>{
    const el=document.createElement('div');
    el.className='card';
    el.dataset.index=i;
    if(state.matched.has(i)) el.classList.add('flipped','matched');
    el.innerHTML=`
      <div class="card-face card-back">
        <span class="label">MYAGKAYA MATH</span>
      </div>
      <div class="card-face card-front">
        <div class="${card.type==='expr'?'expr':'result'}">${card.text}</div>
        <div class="badge">${card.type==='expr'?'выражение':'результат'}</div>
      </div>
    `;
    el.onclick=()=>flipCard(i, el);
    board.appendChild(el);
  });
}

/* ============================================================
   ПЕРЕВОРОТ КАРТОЧКИ
   ============================================================ */
function flipCard(i, el){
  if(state.lock) return;
  if(state.matched.has(i)) return;
  if(state.opened.includes(i)) return;

  if(!state.started){
    state.started=true;
    state.timer=setInterval(()=>{
      state.seconds++;
      document.getElementById('statTime').textContent=fmtTime(state.seconds);
    },1000);
  }

  el.classList.add('flipped');
  state.opened.push(i);

  if(state.opened.length===2){
    state.moves++;
    document.getElementById('statMoves').textContent=state.moves;
    const [i1,i2]=state.opened;
    const c1=state.cards[i1], c2=state.cards[i2];

    if(c1.pairId===c2.pairId && c1.type!==c2.type){
      setTimeout(()=>{
        const el1=document.querySelector(`.card[data-index="${i1}"]`);
        const el2=document.querySelector(`.card[data-index="${i2}"]`);
        if(el1) el1.classList.add('matched');
        if(el2) el2.classList.add('matched');
        state.matched.add(i1);
        state.matched.add(i2);
        state.opened=[];
        updateStats();
        if(state.matched.size/2===TOPICS[state.topic].pairs.length){
          win();
        }
      }, 350);
    } else {
      state.lock=true;
      setTimeout(()=>{
        const el1=document.querySelector(`.card[data-index="${i1}"]`);
        const el2=document.querySelector(`.card[data-index="${i2}"]`);
        if(el1) el1.classList.remove('flipped');
        if(el2) el2.classList.remove('flipped');
        state.opened=[];
        state.lock=false;
      }, 900);
    }
  }
}

/* ============================================================
   ОБНОВЛЕНИЕ СТАТИСТИКИ
   ============================================================ */
function updateStats(){
  const t=TOPICS[state.topic];
  document.getElementById('statPairs').textContent=
    `${state.matched.size/2}/${t.pairs.length}`;
  const box=document.getElementById('statPairsBox');
  box.classList.toggle('active', state.matched.size/2===t.pairs.length);
}

/* ============================================================
   ПОБЕДА
   ============================================================ */
function win(){
  if(state.timer){
    clearInterval(state.timer);
    state.timer=null;
  }
  removeAllOverlays();

  const t=TOPICS[state.topic];
  const key=state.topic;
  const isRecord = !state.best[key] || state.seconds < state.best[key];
  if(isRecord){
    state.best[key]=state.seconds;
    safeSet('memoBest', state.best);
    toast('🏆 Новый рекорд!');
  }
  updateBest();

  const perfect = t.pairs.length;
  let stars=1;
  if(state.moves<=perfect+2) stars=3;
  else if(state.moves<=perfect+6) stars=2;

  const wrap=document.getElementById('boardWrap');
  const overlay=document.createElement('div');
  overlay.className='win-overlay';
  overlay.innerHTML=`
    <div class="trophy">🏆</div>
    <h2>Все пары найдены!</h2>
    <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <p>Ходов: <b style="color:var(--gold)">${state.moves}</b> · 
       Время: <b style="color:var(--gold)">${fmtTime(state.seconds)}</b></p>
    <div class="controls">
      <button class="btn gold" onclick="startNewGame()">🎲 Играть снова</button>
      <button class="btn ghost" onclick="closeWin()">👀 Посмотреть поле</button>
    </div>
  `;
  wrap.appendChild(overlay);
}

function closeWin(){
  removeAllOverlays();
}

function updateBest(){
  const b=state.best[state.topic];
  document.getElementById('statBest').textContent=b?fmtTime(b):'—';
}

/* ============================================================
   ПЕРЕМЕШИВАНИЕ
   ============================================================ */
function shuffleBoard(){
  if(!state.started && state.moves===0){
    startNewGame();
    return;
  }
  const unmatchedCards = [];
  const unmatchedIndices = [];
  state.cards.forEach((card, i)=>{
    if(!state.matched.has(i)){
      unmatchedCards.push(card);
      unmatchedIndices.push(i);
    }
  });
  const shuffled = shuffle(unmatchedCards);
  shuffled.forEach((card, k)=>{
    state.cards[unmatchedIndices[k]] = card;
  });
  state.opened=[];
  state.lock=false;
  renderBoard();
}

/* ============================================================
   КНОПКИ
   ============================================================ */
document.getElementById('newGame').onclick=()=>{
  startNewGame();
};
document.getElementById('shuffleAll').onclick=()=>{
  shuffleBoard();
};
document.getElementById('resetStats').onclick=()=>{
  if(!confirm('Сбросить все рекорды?')) return;
  state.best={};
  try{ localStorage.removeItem('memoBest'); }catch(e){}
  updateBest();
  toast('📊 Рекорды сброшены');
};

/* ============================================================
   СТАРТ
   ============================================================ */
renderTopics();
updateTopicInfo();
updateBest();
startNewGame();
</script>
